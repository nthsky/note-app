[package]
name = "note-app"
version = "0.1.0"
description = "桌面便签标注"
authors = ["sky"]
edition = "2021"

[lib]
name = "note_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }
objc2-quartz-core = { version = "0.3", features = ["objc2-core-graphics"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
