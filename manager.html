<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签管理</title>
    <link rel="stylesheet" href="/src/manager.css" />
  </head>
  <body class="manager-body">
    <div class="manager-app">
      <header class="manager-titlebar" data-tauri-drag-region>
        <div class="manager-title" data-tauri-drag-region>
          <strong data-tauri-drag-region>便签浏览器</strong>
          <span id="note-count" data-tauri-drag-region>0 条</span>
        </div>
        <div class="manager-actions">
          <button type="button" id="btn-new" class="primary-btn">新建</button>
          <button type="button" id="btn-refresh" class="ghost-btn">刷新</button>
          <button
            type="button"
            id="btn-close"
            class="icon-btn danger"
            title="关闭"
            aria-label="关闭"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.4 6.4 12 12l5.6-5.6 1.4 1.4L13.4 13.4l5.6 5.6-1.4 1.4L12 14.8l-5.6 5.6-1.4-1.4 5.6-5.6L5 7.8z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="manager-toolbar">
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="搜索标题或内容…"
          autocomplete="off"
        />
      </div>

      <div class="manager-table-wrap">
        <table class="manager-table">
          <thead>
            <tr>
              <th class="col-icon"></th>
              <th class="col-title">标题</th>
              <th class="col-preview">预览</th>
              <th class="col-status">状态</th>
              <th class="col-updated">更新</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="note-list"></tbody>
        </table>
        <div id="empty" class="empty-state" hidden aria-hidden="true">还没有便签</div>
      </div>
    </div>
    <script type="module" src="/src/manager.ts"></script>
  </body>
</html>
