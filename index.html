<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="note">
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <input
            id="note-title"
            class="note-title"
            type="text"
            value="便签"
            maxlength="40"
            spellcheck="false"
            aria-label="便签标题"
            title="点击编辑标题"
          />
        </div>
        <div class="titlebar-actions">
          <button
            type="button"
            id="btn-pin"
            class="icon-btn"
            title="置顶"
            aria-label="置顶"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M14.5 3.5 13 5l1.5 3.5L11 12l-1.2-.8L8 13l3 3 1.8-1.8-.8-1.2 3.5-3.5L17 11l1.5-1.5L14.5 3.5zM5 19l4.5-4.5 1.4 1.4L6.4 20.4 5 19z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-settings"
            class="icon-btn"
            title="外观设置"
            aria-label="外观设置"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9.4 3.1-1.7-.3a7.2 7.2 0 0 0-.6-1.4l1-1.4-1.4-1.4-1.4 1a7.2 7.2 0 0 0-1.4-.6l-.3-1.7h-2l-.3 1.7a7.2 7.2 0 0 0-1.4.6l-1.4-1-1.4 1.4 1 1.4a7.2 7.2 0 0 0-.6 1.4l-1.7.3v2l1.7.3c.1.5.3 1 .6 1.4l-1 1.4 1.4 1.4 1.4-1c.4.3.9.5 1.4.6l.3 1.7h2l.3-1.7c.5-.1 1-.3 1.4-.6l1.4 1 1.4-1.4-1-1.4c.3-.4.5-.9.6-1.4l1.7-.3v-2z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-minimize"
            class="icon-btn"
            title="最小化"
            aria-label="最小化"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M5 12.75h14v1.5H5z" />
            </svg>
          </button>
          <button
            type="button"
            id="btn-close"
            class="icon-btn danger"
            title="关闭"
            aria-label="关闭"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.4 6.4 12 12l5.6-5.6 1.4 1.4L13.4 13.4l5.6 5.6-1.4 1.4L12 14.8l-5.6 5.6-1.4-1.4 5.6-5.6L5 7.8z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section id="settings" class="settings" hidden>
        <label class="field">
          <span>透明度</span>
          <div class="field-row">
            <input
              id="opacity"
              type="range"
              min="35"
              max="100"
              value="92"
            />
            <output id="opacity-value" for="opacity">92%</output>
          </div>
        </label>

        <label class="field">
          <span>背景颜色</span>
          <input id="bg-color" type="color" value="#ffe08a" />
        </label>

        <div class="field">
          <span>背景图片</span>
          <div class="field-row">
            <button type="button" id="btn-bg-image" class="text-btn">
              选择图片
            </button>
            <button type="button" id="btn-clear-bg" class="text-btn ghost">
              清除
            </button>
            <input
              id="bg-image-input"
              type="file"
              accept="image/*"
              hidden
            />
          </div>
        </div>

        <label class="field switch">
          <span>始终置顶</span>
          <input id="always-on-top" type="checkbox" />
        </label>
      </section>

      <textarea
        id="editor"
        class="editor"
        spellcheck="true"
        placeholder="写点什么…"
        aria-label="便签内容"
      ></textarea>

      <div class="resize-hint" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
