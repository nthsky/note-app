<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="note">
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <div class="title-group">
            <button
              type="button"
              id="btn-emoji"
              class="emoji-btn"
              title="选择图标"
              aria-label="选择标题图标"
              aria-expanded="false"
              aria-haspopup="dialog"
            >
              📝
            </button>
            <div id="emoji-picker" class="emoji-picker" hidden role="dialog" aria-label="选择 emoji">
              <!-- filled by script -->
            </div>
            <input
              id="note-title"
              class="note-title"
              type="text"
              value="便签"
              maxlength="40"
              spellcheck="false"
              readonly
              aria-label="便签标题"
            />
            <button
              type="button"
              id="btn-edit-title"
              class="icon-btn edit-title-btn"
              title="编辑标题"
              aria-label="编辑标题"
            >
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M4 17.2V20h2.8l8.2-8.2-2.8-2.8L4 17.2zm14.7-8.3c.3-.3.3-.8 0-1.1l-1.5-1.5a.8.8 0 0 0-1.1 0l-1.2 1.2 2.8 2.8 1-1.4z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="titlebar-actions">
          <button
            type="button"
            id="btn-pin"
            class="icon-btn"
            title="置顶"
            aria-label="置顶"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16 4a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v1.2c0 .5.2 1 .5 1.4L10 9v3.3l-3.6 3.6a1 1 0 0 0 .7 1.7H11v3.9a1 1 0 1 0 2 0V17.6h3.9a1 1 0 0 0 .7-1.7L14 12.3V9l1.5-2.4c.3-.4.5-.9.5-1.4V4z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-settings"
            class="icon-btn"
            title="外观设置"
            aria-label="外观设置"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.64a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-minimize"
            class="icon-btn"
            title="最小化"
            aria-label="最小化"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M5 12.75h14v1.5H5z" />
            </svg>
          </button>
          <button
            type="button"
            id="btn-close"
            class="icon-btn danger"
            title="关闭"
            aria-label="关闭"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.4 6.4 12 12l5.6-5.6 1.4 1.4L13.4 13.4l5.6 5.6-1.4 1.4L12 14.8l-5.6 5.6-1.4-1.4 5.6-5.6L5 7.8z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section id="settings" class="settings" hidden>
        <label class="field">
          <span>透明度</span>
          <div class="field-row">
            <input
              id="opacity"
              type="range"
              min="35"
              max="100"
              value="92"
            />
            <output id="opacity-value" for="opacity">92%</output>
          </div>
        </label>

        <label class="field">
          <span>背景颜色</span>
          <input id="bg-color" type="color" value="#ffe08a" />
        </label>

        <div class="field">
          <span>背景图片</span>
          <div class="field-row">
            <button type="button" id="btn-bg-image" class="text-btn">
              选择图片
            </button>
            <button type="button" id="btn-clear-bg" class="text-btn ghost">
              清除
            </button>
            <input
              id="bg-image-input"
              type="file"
              accept="image/*"
              hidden
            />
          </div>
        </div>

        <label class="field switch">
          <span>始终置顶</span>
          <input id="always-on-top" type="checkbox" />
        </label>
      </section>

      <textarea
        id="editor"
        class="editor"
        spellcheck="true"
        placeholder="写点什么…"
        aria-label="便签内容"
      ></textarea>

      <div class="resize-hint" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
