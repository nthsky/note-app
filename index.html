<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="note">
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <div class="title-group">
            <button
              type="button"
              id="btn-emoji"
              class="emoji-btn"
              title="选择图标"
              aria-label="选择标题图标"
              aria-expanded="false"
              aria-haspopup="dialog"
            >
              📝
            </button>
            <div id="emoji-picker" class="emoji-picker" hidden role="dialog" aria-label="选择 emoji">
              <!-- filled by script -->
            </div>
            <input
              id="note-title"
              class="note-title"
              type="text"
              value="便签"
              maxlength="40"
              spellcheck="false"
              readonly
              aria-label="便签标题"
            />
            <button
              type="button"
              id="btn-edit-title"
              class="icon-btn edit-title-btn"
              title="编辑标题"
              aria-label="编辑标题"
            >
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M4 17.2V20h2.8l8.2-8.2-2.8-2.8L4 17.2zm14.7-8.3c.3-.3.3-.8 0-1.1l-1.5-1.5a.8.8 0 0 0-1.1 0l-1.2 1.2 2.8 2.8 1-1.4z"
                />
              </svg>
            </button>
          </div>
        </div>
        <div class="titlebar-actions">
          <button
            type="button"
            id="btn-new"
            class="icon-btn"
            title="新建便签"
            aria-label="新建便签"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-manager"
            class="icon-btn"
            title="便签管理"
            aria-label="便签管理"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M4 5h16v2H4V5zm0 6h16v2H4v-2zm0 6h16v2H4v-2z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-pin"
            class="icon-btn"
            title="置顶"
            aria-label="置顶"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M16 4a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v1.2c0 .5.2 1 .5 1.4L10 9v3.3l-3.6 3.6a1 1 0 0 0 .7 1.7H11v3.9a1 1 0 1 0 2 0V17.6h3.9a1 1 0 0 0 .7-1.7L14 12.3V9l1.5-2.4c.3-.4.5-.9.5-1.4V4z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-settings"
            class="icon-btn"
            title="外观设置"
            aria-label="外观设置"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.64a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.3.59.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="btn-minimize"
            class="icon-btn"
            title="最小化"
            aria-label="最小化"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M5 12.75h14v1.5H5z" />
            </svg>
          </button>
          <button
            type="button"
            id="btn-close"
            class="icon-btn danger"
            title="关闭"
            aria-label="关闭"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6.4 6.4 12 12l5.6-5.6 1.4 1.4L13.4 13.4l5.6 5.6-1.4 1.4L12 14.8l-5.6 5.6-1.4-1.4 5.6-5.6L5 7.8z"
              />
            </svg>
          </button>
        </div>
      </header>

      <section id="settings" class="settings" hidden>
        <label class="field">
          <span>透明度</span>
          <div class="field-row">
            <input
              id="opacity"
              type="range"
              min="35"
              max="100"
              value="92"
            />
            <output id="opacity-value" for="opacity">92%</output>
          </div>
        </label>

        <label class="field">
          <span>背景颜色</span>
          <input id="bg-color" type="color" value="#ffe08a" />
        </label>

        <div class="field">
          <span>背景图片</span>
          <div class="field-row">
            <button type="button" id="btn-bg-image" class="text-btn">
              选择图片
            </button>
            <button type="button" id="btn-clear-bg" class="text-btn ghost">
              清除
            </button>
            <input
              id="bg-image-input"
              type="file"
              accept="image/*"
              hidden
            />
          </div>
        </div>

        <label class="field switch">
          <span>始终置顶</span>
          <input id="always-on-top" type="checkbox" />
        </label>
      </section>

      <div id="format-toolbar" class="format-toolbar" role="toolbar" aria-label="文字格式">
        <label class="fmt-size-wrap" title="文字样式">
          <span class="sr-only">文字样式</span>
          <select id="fmt-size" class="fmt-size" aria-label="文字样式">
            <option value="body" selected>正文</option>
            <option value="h1">标题 1</option>
            <option value="h2">标题 2</option>
            <option value="h3">标题 3</option>
            <option value="h4">标题 4</option>
          </select>
        </label>
        <div class="fmt-color-wrap">
          <button
            type="button"
            id="fmt-color"
            class="fmt-color-btn"
            title="字体颜色"
            aria-label="字体颜色"
            aria-expanded="false"
            aria-haspopup="dialog"
          >
            <span class="fmt-color-letter" aria-hidden="true">A</span>
            <span class="fmt-color-bar" aria-hidden="true"></span>
          </button>
          <div
            id="fmt-color-panel"
            class="fmt-color-panel"
            hidden
            role="dialog"
            aria-label="字体颜色"
          >
            <div class="fmt-color-label">字体颜色</div>
            <div id="fmt-color-swatches" class="fmt-color-swatches"></div>
            <button type="button" id="fmt-color-reset" class="fmt-color-reset">
              恢复默认
            </button>
          </div>
        </div>
        <span class="fmt-divider" aria-hidden="true"></span>
        <button
          type="button"
          id="fmt-bold"
          class="fmt-btn"
          title="加粗"
          aria-label="加粗"
          aria-pressed="false"
        >
          <strong>B</strong>
        </button>
        <button
          type="button"
          id="fmt-italic"
          class="fmt-btn"
          title="斜体"
          aria-label="斜体"
          aria-pressed="false"
        >
          <em>I</em>
        </button>
        <button
          type="button"
          id="fmt-underline"
          class="fmt-btn"
          title="下划线"
          aria-label="下划线"
          aria-pressed="false"
        >
          <span class="fmt-u">U</span>
        </button>
        <button
          type="button"
          id="fmt-strike"
          class="fmt-btn"
          title="删除线"
          aria-label="删除线"
          aria-pressed="false"
        >
          <span class="fmt-s">S</span>
        </button>
        <span class="fmt-divider" aria-hidden="true"></span>
        <button
          type="button"
          id="fmt-bullet"
          class="fmt-btn fmt-btn-icon"
          title="无序列表"
          aria-label="无序列表"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <circle cx="5" cy="7" r="1.6" fill="currentColor" />
            <circle cx="5" cy="12" r="1.6" fill="currentColor" />
            <circle cx="5" cy="17" r="1.6" fill="currentColor" />
            <path
              d="M9 7h11M9 12h11M9 17h11"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
        <button
          type="button"
          id="fmt-ordered"
          class="fmt-btn fmt-btn-icon"
          title="有序列表"
          aria-label="有序列表"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path
              d="M4 6.5V5h2.4v8H4.8v-1.1H5.6V6.5H4zm0 9.2V14h1.2c.5 0 .8.2.8.6 0 .3-.2.5-.5.6l.7 1.5H5.2l-.5-1.2H4.8v1.2H4zm14.5-11H9v1.6h9.5V4.7zM9 11.2h9.5v1.6H9v-1.6zm0 6.5h9.5V19H9v-1.6z"
              fill="currentColor"
            />
          </svg>
        </button>
        <button
          type="button"
          id="fmt-todo"
          class="fmt-btn fmt-btn-icon"
          title="待办列表"
          aria-label="待办列表"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <rect
              x="3.5"
              y="4.5"
              width="6"
              height="6"
              rx="1.2"
              stroke="currentColor"
              stroke-width="1.7"
              fill="none"
            />
            <path
              d="M5.1 7.4l1.2 1.2 2.1-2.4"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <path
              d="M12 7h8.5M3.5 16.5h6v6h-6v-6zM12 19.5h8.5"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>
      </div>

      <div class="editor-shell">
        <div
          id="editor-placeholder"
          class="editor-placeholder"
          aria-hidden="true"
        >
          写点什么…
        </div>
        <div
          id="editor"
          class="editor is-empty"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          spellcheck="true"
          aria-label="便签内容"
        ></div>
      </div>

      <div class="resize-hint" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
